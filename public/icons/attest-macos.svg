<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon: the squircle icon on Apple's 1024 grid (824px body, 100px margin) with the
       standard soft drop shadow. macOS does not mask icons, so the shape and margin live here. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <image href="attest.svg" xlink:href="attest.svg" x="100" y="100" width="824" height="824" filter="url(#shadow)"/>
</svg>

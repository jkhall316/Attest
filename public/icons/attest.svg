<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Attest app icon. Squircle with depth layers: indigo base, frosted-glass plate, an "A"
       crest whose crossbar is an audio waveform, and a validator arc that ends in an emerald
       node (heard, then verified). Full-bleed variant: attest-maskable.svg. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#312e81"/><stop offset="1" stop-color="#0b0a24"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".55"/><stop offset=".45" stop-color="#6366f1" stop-opacity=".18"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0"/><stop offset=".55" stop-color="#a5b4fc" stop-opacity=".7"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05041a" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sq"><path id="squircle" d="M512 0C841 0 1024 183 1024 512S841 1024 512 1024 0 841 0 512 183 0 512 0Z"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <rect width="1024" height="1024" fill="url(#bloom)"/>
    <!-- frosted plate -->
    <path d="M512 92C788 92 932 236 932 512S788 932 512 932 92 788 92 512 236 92 512 92Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
    <!-- validator arc -->
    <path d="M214 700A330 330 0 0 0 806 690" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="806" cy="690" r="30" fill="#34d399" filter="url(#glow)" opacity=".8"/>
    <circle cx="806" cy="690" r="22" fill="#34d399" stroke="#ecfdf5" stroke-width="5"/>
    <!-- A crest + waveform crossbar -->
    <g filter="url(#lift)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="312,742 512,262 712,742" stroke="url(#ink)" stroke-width="92"/>
      <g stroke="#e0e7ff" stroke-width="22">
        <line x1="450" y1="580" x2="450" y2="640"/>
        <line x1="481" y1="542" x2="481" y2="678"/>
        <line x1="512" y1="568" x2="512" y2="652"/>
        <line x1="543" y1="522" x2="543" y2="698"/>
        <line x1="574" y1="586" x2="574" y2="634"/>
      </g>
    </g>
    <!-- top sheen -->
    <path d="M0 0H1024V380C780 300 300 300 0 420Z" fill="#fff" opacity=".06"/>
  </g>
</svg>
